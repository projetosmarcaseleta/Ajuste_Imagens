version: '3.8'

services:
  web:
    build: .
    container_name: app_processamento_imagens
    ports:
      - "3003:3003"
    volumes:
      - ./uploads:/app/uploads
      - ./saida:/app/saida
      # Mantém cache dos modelos de remoção de fundo
      - ./u2net_models:/root/.u2net
      # Cache do birefnet (evita re-download a cada rebuild)
      - birefnet_cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
    restart: unless-stopped

volumes:
  birefnet_cache:
